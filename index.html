<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imperial Cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Serif SC', serif;
      }
      .font-calligraphy {
        font-family: 'Ma Shan Zheng', cursive;
      }
      /* Custom Scrollbar - Wood Style */
      .royal-scroll {
        scrollbar-width: thin;
        scrollbar-color: #78350f #292524;
      }
      .royal-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .royal-scroll::-webkit-scrollbar-track {
        background: #292524; /* Stone 800 */
      }
      .royal-scroll::-webkit-scrollbar-thumb {
        background-color: #92400e; /* Amber 800 */
        border-radius: 3px;
      }
      
      /* Textures */
      .bg-rice-paper {
        background-color: #fdfbf7;
        background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
      }
      .bg-dark-wood {
        background-color: #1c1917;
        background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png");
      }
      .writing-vertical {
        writing-mode: vertical-rl;
        text-orientation: upright;
      }
    </style>
